[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mnemolith"
version = "0.2.0"
description = "Shared memory for AI coding tools that stays true to your code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anish Chugh" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.2",
    "fastembed>=0.3",
    "redis>=5.0",
]

[project.urls]
Homepage = "https://mnemolith.dev/"
Repository = "https://github.com/anishchugh05/mnemolith"

[project.scripts]
mnemolith = "mnemolith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mnemolith"]
artifacts = ["mnemolith/engine/mnemolith-engine.jar"]  # *.jar is gitignored; ship this one anyway

[tool.hatch.build.targets.sdist]
include = ["mnemolith", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["mnemolith/engine/mnemolith-engine.jar"]

[tool.uv]
# rebuild when the code changes, not only when this file does (uv's default for local installs)
cache-keys = [{ file = "pyproject.toml" }, { file = "mnemolith/**/*.py" }, { file = "mnemolith/engine/*.jar" }, { file = "mnemolith/ui/*.html" }, { file = "mnemolith/ui/fonts/*" }]
