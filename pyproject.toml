[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aether-cache"
version = "0.1.9"
description = "Shared memory for AI coding tools that stays true to your code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anish Chugh" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.2",
    "fastembed>=0.3",
    "redis>=5.0",
]

[project.urls]
Homepage = "https://anishchugh05.github.io/Aether-Cache-Redis-Compatible-Vector-Store/"
Repository = "https://github.com/anishchugh05/Aether-Cache-Redis-Compatible-Vector-Store"

[project.scripts]
aether-cache = "aether_cache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aether_cache"]
artifacts = ["aether_cache/engine/aether-engine.jar"]  # *.jar is gitignored; ship this one anyway

[tool.hatch.build.targets.sdist]
include = ["aether_cache", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["aether_cache/engine/aether-engine.jar"]

[tool.uv]
# rebuild when the code changes, not only when this file does (uv's default for local installs)
cache-keys = [{ file = "pyproject.toml" }, { file = "aether_cache/**/*.py" }, { file = "aether_cache/engine/*.jar" }, { file = "aether_cache/ui/*.html" }, { file = "aether_cache/ui/fonts/*" }]
